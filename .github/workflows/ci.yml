name: KOSIF Think CI

on:
  push:
    branches: [main, integration/unified-kosif]
  pull_request:
    branches: [main, integration/unified-kosif]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile unified runtime
        run: python -m compileall -q src/kosif_think
      - name: Run full unit test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
