name: KOSIF Think Python model gateway tests
on:
  pull_request:
    paths:
      - 'src/kosif_think/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/python-model-gateway-ci.yml'
  push:
    branches: [main]
    paths:
      - 'src/kosif_think/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/python-model-gateway-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -e '.[dev]'
      - name: Compile sources
        run: python -m compileall -q src/kosif_think
      - name: Full regression test suite
        run: python -m pytest -q
